<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>About</title>

        <link rel="stylesheet" type="text/css" href="/styles.css">
        <link rel="stylesheet" type="text/css" href="/about.css">
    </head>
    <body>
        <div id="navbar">
            <div id="navbar-links">
                <a href="/" id="navbar-platform-title">Slimetube</a>
                <form id="search-bar" method="get" action="/search" >
                    <input id="search-bar-query" name="q" type="search" placeholder="search for videos..." value="[[search_query]]">
                    <input id="search-bar-submit" type="submit" value="search">
                </form>
                <a href="/account" id="navbar-account-link">account</a>
            </div>
        </div>

        <div id="main-content">
            <div id="about-title-text">About Page</div>
            <hr>
            <div id="about-text">
                Put your about text here.
            </div>
        </div>

        <div id="footer">
            <div id="footer-links">
                <a href="/about" id="footer-about-link">about</a>
            </div>
        </div>

    </body>
</html>
