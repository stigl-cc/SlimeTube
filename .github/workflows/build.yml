name: Build for linux

on: [push, pull_request]

jobs:
  build-for-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-build
          key: ${{ runner.os }}-cmake-build-${{ hashFiles('CMakeLists.txt', '**/*.cc', '**/*.hh', '**/*.h', '**/*.csp', '!lib/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-build-

      - name: Install deps
        run: sudo apt install -y drogon libsqlite3-dev libjsoncpp-dev libbrotli-dev libssl-dev libzstd-dev uuid-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        run: cmake --build build --config Release -j12

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-build
          path: build/slimytube
