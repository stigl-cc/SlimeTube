name: Build for linux

on: [push, pull_request]

jobs:
  build-for-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Cache
        uses: actions/cache@v6
        with:
          path: build
          key: ${{ runner.os }}-cmake-build-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.hpp', '**/*.cc', '**/*.hh', '**/*.c',  '**/*.h', '**/*.csp', '!lib/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-build-

      - name: Cache deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: drogon libsqlite3-dev libjsoncpp-dev libbrotli-dev libssl-dev libzstd-dev uuid-dev
          version: 1.0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        run: cmake --build build --config Release -j12

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-build
          path: build/slimytube
