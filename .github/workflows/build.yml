name: Build for linux

on: [push, pull_request]

jobs:
  build-for-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Cache deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: drogon libsqlite3-dev libjsoncpp-dev libbrotli-dev libssl-dev libzstd-dev uuid-dev ccache libavfilter-dev libavformat-dev libavcodec-dev libswresample-dev libswscale-dev libavutil-dev
          version: 1.0

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-release
          verbose: 2
          create-symlink: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compile
        run: cmake --build build --config Release -j12

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-build
          path: build/slimytube
